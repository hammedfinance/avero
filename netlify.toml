[build]
  command = "bun run build"
  publish = "dist"

# Proxy /api/* to the backend server (Railway/Render URL)
# Update VITE_API_URL in your Netlify environment variables
# to point to your deployed backend once it is live.
[[redirects]]
  from = "/api/*"
  to = "https://avero-production-a424.up.railway.app/:splat"
  status = 200
  force = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
